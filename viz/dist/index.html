<style>
/* Layout: one reading column for the problem; a two-column workbench (pseudocode | animation) below; results tucked in a disclosure. */
:root {
  --bg: #f1e6d2;          /* beige */
  --surface: #e8dac0;
  --ghost: #dfcfb2;
  --line: #d4c09f;
  --line-strong: #a88f6f;
  --ink: #2a1e14;
  --muted: #6b5743;
  --accent: #d9631e;      /* orange */
  --on-accent: #fffaf2;
  --w0: #d9631e;          /* thread 1: orange */
  --w1: #b8861a;          /* thread 2: ochre */
  --w2: #9a3a1a;          /* thread 3: brick */
  --r-fill: #efcf8f;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1510; --surface: #251c15; --ghost: #33281e; --line: #3d3026; --line-strong: #6e5a47;
    --ink: #f3e9da; --muted: #b39e86; --accent: #f08a3e; --on-accent: #1b1510;
    --w0: #f08a3e; --w1: #e0b04a; --w2: #e2714b; --r-fill: #5b4521;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1510; --surface: #251c15; --ghost: #33281e; --line: #3d3026; --line-strong: #6e5a47;
  --ink: #f3e9da; --muted: #b39e86; --accent: #f08a3e; --on-accent: #1b1510;
  --w0: #f08a3e; --w1: #e0b04a; --w2: #e2714b; --r-fill: #5b4521;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 48px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.12; }
h1 { font-size: clamp(2rem, 4.4vw, 3.1rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.55rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
.eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.credits { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 0.88rem; color: var(--muted); }
.credits b { color: var(--ink); font-weight: 600; }
.lede { max-width: 64ch; color: var(--muted); font-size: 1.05rem; }
header { display: grid; gap: 14px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.toplinks { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.gh { display: inline-flex; align-items: center; gap: 7px; font: 600 0.85rem var(--body); color: var(--ink); text-decoration: none; border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 11px; }
.gh:hover { border-color: var(--accent); color: var(--accent); }
.gh svg { width: 16px; height: 16px; fill: currentColor; }
.lang, .theme { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.lang button, .theme button { font: 600 0.8rem var(--mono); letter-spacing: 0.06em; color: var(--muted); background: transparent; border: 0; padding: 5px 11px; cursor: pointer; }
.lang button[aria-pressed="true"], .theme button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
code, .mono { font-family: var(--mono); font-size: 0.9em; }
.formula { font-family: var(--mono); background: var(--surface); padding: 2px 7px; border-radius: 4px; white-space: nowrap; }

/* problem */
.problem { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 32px; align-items: start; }
.problem .text { display: grid; gap: 14px; max-width: 66ch; min-width: 0; }
.problem figure { margin: 0; display: grid; gap: 8px; }
.problem figure svg { background: var(--surface); border-radius: 8px; }
.problem figcaption { font-size: 0.85rem; color: var(--muted); }
.cite { font-family: var(--mono); font-size: 0.78em; text-decoration: none; vertical-align: 0.15em; }
.cite:hover { text-decoration: underline; }
.refs { margin: 4px 0 0; padding: 12px 0 0 1.6em; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 0.8rem; color: var(--muted); }
.refs li { padding-left: 2px; }
.refs li:target { color: var(--ink); }
.refs-note { font-size: 0.8rem; color: var(--muted); margin: 0; padding-left: 0.2em; }
.refs .rt { display: inline-block; font: 600 0.68rem var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 6px; margin-right: 8px; vertical-align: 0.1em; }
.refs .rn { display: block; font-size: 0.95em; opacity: 0.85; }
.tag-np { display: inline-block; font-family: var(--mono); font-size: 0.78rem; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 1px 9px; }

/* workbench */
.bench { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 28px; align-items: start; }
.bench > * { min-width: 0; }
.code-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 14px; }
.code { list-style: none; margin: 0; padding: 14px 0; background: var(--surface); border-radius: 8px; font-family: var(--mono); font-size: 0.75rem; line-height: 1.75; overflow-x: auto; }
.code li { display: grid; grid-template-columns: 2.6em max-content auto; align-items: center; padding-right: 14px; transition: background-color .2s; white-space: pre; }
.code .ln { color: var(--muted); text-align: right; padding-right: 1em; user-select: none; }
.code .cm { color: var(--muted); }
.code .kw { color: var(--accent); font-weight: 600; }
.code .badge { font-size: 0.68rem; letter-spacing: 0.04em; border-radius: 4px; padding: 1px 6px; margin-left: 8px; border: 1px solid currentColor; }
.code .badge.par { color: var(--w0); }
.code .badge.crit { color: var(--w2); }
.code li.hl { background: color-mix(in srgb, var(--hlc, var(--accent)) 20%, transparent); }
.code li .dots { display: inline-flex; gap: 4px; margin-left: 10px; }
.code li .dots i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.gloss { display: grid; gap: 4px; font-size: 0.84rem; color: var(--muted); margin: 0; padding: 0; list-style: none; }
.gloss b { color: var(--ink); font-family: var(--mono); font-weight: 600; font-size: 0.82rem; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab { font: 600 0.92rem var(--body); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 9px; cursor: pointer; margin-bottom: -1px; }
.tab .sub { font-weight: 400; font-size: 0.78rem; margin-left: 6px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stage { display: grid; gap: 14px; padding-top: 16px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.btn { font: 600 0.85rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); min-width: 104px; }
.btn:hover { filter: brightness(0.97); }
.speed { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
.speed input { width: 96px; accent-color: var(--accent); }
.counter { margin-left: auto; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.status { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 0.78rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
.chip b { color: var(--accent); font-weight: 600; }
.chip.ok { border-color: var(--accent); color: var(--accent); }
.caption { min-height: 4.8em; font-size: 0.92rem; display: grid; gap: 3px; align-content: start; }
.caption .ln-w { display: flex; gap: 8px; align-items: baseline; }
.caption .who { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
.graphs { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 12px; }
.gbox { display: grid; gap: 4px; min-width: 0; }
.gbox .ghead { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 0.74rem; color: var(--muted); flex-wrap: wrap; }
.gbox .ghead .wname { font-weight: 600; }
.gbox svg { width: 100%; height: auto; max-height: 190px; background: var(--surface); border-radius: 8px; border-top: 3px solid var(--wc, var(--accent)); }
.single .gbox svg { max-height: 230px; }
.g-edge { stroke: var(--line-strong); stroke-width: 1.6; transition: opacity .25s; }
.g-edge.off { opacity: .25; }
.g-node circle { fill: var(--bg); stroke: var(--line-strong); stroke-width: 1.6; transition: fill .25s, stroke .25s; }
.g-node text { font: 600 13px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.g-node .x { stroke: var(--on-accent); stroke-width: 2.4; opacity: 0; }
.g-node.reg circle { stroke: var(--accent); stroke-width: 2.6; }
.g-node.nb circle { fill: var(--ghost); stroke-dasharray: 3 3; }
.g-node.nb text { fill: var(--muted); }
.g-node.r circle { fill: var(--r-fill); stroke: var(--w1); stroke-width: 2.6; }
.g-node.c1 circle { fill: var(--accent); stroke: var(--accent); }
.g-node.c1 text { fill: var(--on-accent); }
.g-node.s circle { fill: var(--w2); stroke: var(--w2); }
.g-node.s text { opacity: 0; }
.g-node.s .x { opacity: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 13px; height: 13px; border-radius: 50%; display: inline-block; border: 2px solid var(--line-strong); background: var(--bg); vertical-align: -2px; }
.sw.c1 { background: var(--accent); border-color: var(--accent); }
.sw.nb { background: var(--ghost); border-style: dashed; }
.sw.reg { border-color: var(--accent); }
.sw.r { background: var(--r-fill); border-color: var(--w1); }
.sw.s { background: var(--w2); border-color: var(--w2); }
.sw.box { border-radius: 4px; width: 18px; }
.sw.box.pr { border-style: dashed; background: transparent; }
.sw.box.ck { border-color: var(--accent); }
.sw.box.im { background: var(--accent); border-color: var(--accent); }
.tree-wrap { background: var(--surface); border-radius: 8px; overflow: auto; max-height: 440px; }
.tree-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tree-head .hint { font-size: 0.78rem; color: var(--muted); }
svg.tree { display: block; }
.te { fill: none; stroke: var(--line); stroke-width: 1.3; transition: stroke .3s; }
.te.vis { stroke: var(--line-strong); }
.tn rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; transition: fill .25s, stroke .25s, stroke-width .2s; }
.tn text { font: 500 11px var(--mono); fill: var(--muted); dominant-baseline: central; transition: fill .25s; }
.tn .inner { transform-box: fill-box; transform-origin: center; }
.tn.ghost { opacity: .38; }
.tn.vis rect { stroke: var(--wc, var(--line-strong)); }
.tn.vis text { fill: var(--ink); }
.tn.vis .inner { animation: pop .32s ease-out; }
.tn.root rect { fill: var(--ink); stroke: var(--ink); }
.tn.root text { fill: var(--bg); font-weight: 600; }
.tn.root.ghost { opacity: .55; }
.tn.pruned rect { stroke-dasharray: 4 3; fill: transparent; }
.tn.pruned text { fill: var(--muted); text-decoration: line-through; }
.tn.checked rect { stroke-width: 2; }
.tn.improved rect { fill: var(--wc, var(--accent)); stroke: var(--wc, var(--accent)); }
.tn.improved text { fill: var(--on-accent); font-weight: 600; }
.tn.cur rect { stroke-width: 3; }
.tn.cur .inner { animation: pop .32s ease-out, pulse 1.1s ease-in-out infinite .32s; }
@keyframes pop { from { transform: scale(.55); opacity: .2; } to { transform: scale(1); opacity: 1; } }
@keyframes pulse { 50% { opacity: .55; } }

/* results */
details.tests { border-top: 1px solid var(--line); padding-top: 18px; }
details.tests > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
details.tests > summary::-webkit-details-marker { display: none; }
details.tests > summary h2::before { content: "▸"; display: inline-block; color: var(--accent); margin-right: 10px; transition: transform .2s; }
details.tests[open] > summary h2::before { transform: rotate(90deg); }
details.tests > summary .sum-note { color: var(--muted); font-size: 0.9rem; }
.tests-body { display: grid; gap: 22px; padding-top: 20px; }
.env { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 32px; }
.env dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 0.9rem; }
.env dt { color: var(--muted); }
.env dd { margin: 0; min-width: 0; }
.env .sub { color: var(--muted); }
.cmd { font-family: var(--mono); font-size: 0.8rem; background: var(--surface); border-radius: 6px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.flags { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 0.88rem; }
.flags code { color: var(--accent); font-weight: 600; }
.table-wrap { overflow-x: auto; }
table.grid { border-collapse: separate; border-spacing: 3px; font-variant-numeric: tabular-nums; min-width: 760px; width: 100%; }
table.grid th { font: 600 0.78rem var(--mono); color: var(--muted); padding: 4px 6px; text-align: center; }
table.grid th[scope="row"] { text-align: right; padding-right: 10px; }
table.grid td { text-align: center; padding: 6px 4px; border-radius: 5px; background: color-mix(in srgb, var(--accent) var(--heat, 0%), var(--surface)); }
table.grid td .zx { font-family: var(--mono); font-weight: 600; font-size: 0.86rem; display: block; }
table.grid td .t { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); display: block; }
table.grid td.miss { outline: 2.5px solid var(--w2); outline-offset: -2.5px; }
table.grid td.miss .zx { color: var(--w2); }
table.grid td.hot .t { color: var(--ink); }
table.grid td.na { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-family: var(--mono); }
.notes .mk { font-family: var(--mono); white-space: nowrap; margin-right: 6px; color: var(--ink); }
.notes { display: grid; gap: 6px; font-size: 0.86rem; color: var(--muted); max-width: 80ch; }
.method-row { display: grid; gap: 8px; }
.method-lbl { font: 600 0.72rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.method { display: flex; flex-wrap: wrap; gap: 8px; }
.method button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; min-width: 150px; padding: 8px 14px 9px; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line-strong); border-radius: 8px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.method button .mt-t { font: 600 0.9rem var(--body); }
.method button .mt-s { font: 0.72rem var(--mono); color: var(--muted); }
.method button:hover:not(:disabled) { border-color: var(--accent); background: var(--surface); }
.method button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.method button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.method button[aria-pressed="true"] .mt-s { color: var(--on-accent); opacity: 0.85; }
.method button[aria-pressed="true"] .mt-t::before { content: "● "; }
.method button:disabled { opacity: 0.45; border-style: dashed; cursor: not-allowed; }
@media (max-width: 480px) { .method button { flex: 1 1 100%; } }
.method-sum { margin: 0; font-size: 0.86rem; color: var(--muted); }
.method-sum b { color: var(--ink); }
.scale { display: flex; align-items: center; gap: 8px; font-size: 0.76rem; color: var(--muted); font-family: var(--mono); flex-wrap: wrap; }
.scale .bar { width: 140px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--surface), color-mix(in srgb, var(--accent) 75%, var(--surface))); }

@media (max-width: 1000px) {
  .bench { grid-template-columns: minmax(0, 1fr); }
  .code-col { position: static; }
  .problem { grid-template-columns: minmax(0, 1fr); }
  .env { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .graphs { grid-template-columns: minmax(0, 1fr); }
  .counter { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { transition: none !important; animation: none !important; }
}
</style>

// Produces serial and parallel event lists for the animation page.
const N = 7;
const EDGES = [[1,2],[1,6],[1,7],[2,6],[2,7],[3,4],[3,5],[4,5],[5,7]];
const adj = Array.from({length: N + 1}, () => new Set());
for (const [a, b] of EDGES) { adj[a].add(b); adj[b].add(a); }
const V = [1,2,3,4,5,6,7];

function comps(S) {               // components of G[S]
  const left = new Set(S), out = [];
  while (left.size) {
    const s = left.values().next().value, c = [s]; left.delete(s);
    for (let i = 0; i < c.length; i++) for (const w of adj[c[i]]) if (left.has(w)) { left.delete(w); c.push(w); }
    out.push(c);
  }
  return out;
}
const maxcomp = S => comps(S).reduce((m, c) => Math.max(m, c.length), 0);
function closedN(S) { const r = new Set(S); for (const v of S) for (const w of adj[v]) r.add(w); return r; }
const region = A => { const cn = closedN(A); return V.filter(v => !cn.has(v)); };
const Lof = R => maxcomp(region(R));   // largest component of G - N[R]
function destroyed(R) {           // S = V \ (R + largest component of G - N[R])
  const cs = comps(region(R)); let L = [];
  for (const c of cs) if (c.length > L.length) L = c;
  const K = new Set([...R, ...L]); return V.filter(v => !K.has(v));
}

// best R in P with every component <= k, maximising (|R|, L(R))
function bestR(P, k) {
  let best = null;
  for (let m = 0; m < (1 << P.length); m++) {
    const R = P.filter((_, i) => m >> i & 1);
    if (maxcomp(R) > k) continue;
    const f = R.length, y = Lof(R);
    if (!best || f > best.f || (f === best.f && y > best.y)) best = {R, f, y};

}

// independent-set start: F = alpha - 1, Y = best L(I \ {v})
function misStart() {
  let I = [];
  for (let m = 0; m < 128; m++) {
    const S = V.filter((_, i) => m >> i & 1);
    if (S.every(a => S.every(b => a === b || !adj[a].has(b))) && S.length > I.length) I = S;
  }
  let Y = 1, R = I.slice(1);
  for (const v of I) { const r = I.filter(x => x !== v), y = Lof(r); if (y > Y) { Y = y; R = r; } }

}

// run one anchor with local (F, Y); returns events and whether (F, Y) improved
function runAnchor(c, st, nodeId, parentId) {
  const ev = [];

  function dfs(A, Fr, Allow, parent) {
    const id = nodeId(); const P = region(A);

        ev.push({t: 'improve', id, A: A.slice(), P, R: b.R, F: st.F, Y: st.Y, line: 12});

    while (Fr.length) {
      const u = Fr[0], A2 = [...A, u].sort((a, b) => a - b);

    }

  dfs([c], [...adj[c]].filter(w => w > c).sort((a, b) => a - b), above, parentId);
  return {ev, improved};
}

function serial() {
  const s0 = misStart(), st = {F: s0.F, Y: s0.Y, R: s0.R}, ev = [];

function parallel(T) {

  return steps;
}

    seed_title: "kesin çözücü, ILS başlangıçlı",
    notes_seed: `<p>Hücre: <b>Z/X</b> ve programın ölçtüğü süre (ILS dahil).</p><p><b class="mk">[?]</b> 300 sn sınırında ispatlanamadı: yazılan çözüm geçerli ama optimal olduğu bilinmiyor.</p><p><b class="mk">[+]</b> ILS'siz kesin çözücünün aynı sürede bulduğundan daha iyi.</p>

      <p>Ayarlar: dosya başına 300 sn (<code>-t 300</code>, ILS dahil), dosyalar sırayla, aralarında 10 sn bekleme. Bütün çıktılar <code>tools/verify.py</code> ile kontrol edildi.</p>`,

    ils_title: "sezgisel ILS, süre = en iyi çözüme ulaşma",
    notes_ils: `<p>Hücre: <b>Z/X</b> ve sezgisel çözücünün en iyi çözümünü bulduğu an (işlemci süresi).</p><p><b class="mk">[✓]</b> kesin çözücünün ispatlı optimumuyla aynı.</p><p><b class="mk">[≠]</b> farklı. Bench'teki 19040'ta olduğu gibi Z doğru olup X fazla çıkabilir: sezgisel çözücü aynı Z'yi daha az bilgisayar parçalayarak veren çözümü kaçırabilir.</p><p><b class="mk">[?]</b> karşılaştırılacak ispatlı sonuç yok: ya kesin çözücü bu dosyayı koşmadı ya da süre sınırında ispatlayamadı.</p>
      <p><b>Kesin çözücü ile farkı:</b> kesin çözücü arama ağacının tamamını tarar ve daha iyi bir çözüm olmadığını ispatlar. Sezgisel ILS <a class="cite" href="#ref-6">[6]</a> ise yerel arama yapar: iyi bir çözümü çok hızlı bulur ama en iyi olduğunu ispatlayamaz. İspatlı dosyalarda ikisi neredeyse her zaman aynı cevaba vardı. Kesin çözücünün süresinin neredeyse tamamı çözümü bulmaya değil, ispata gidiyor.</p>
      <p>Ayarlar: <code>alternatif_cozuculer/heur</code>, aynı derleme bayrakları (<code>-fopenmp</code> olmadan), dosya başına 10 sn işlemci süresi (<code>-t 10</code>), tohum 1, 8 dosya aynı anda. Uzun süre iyileşme bulamayınca sınırı beklemeden durur. Bütün çıktılar <code>tools/verify.py</code> ile kontrol edildi.</p>`,

      <dt>Koşu</dt><dd>Kesin çözücü: <b>16 çekirdek</b>, 16 iş parçacığı (<code>OMP_NUM_THREADS=16</code>). Sezgisel ILS: tek iş parçacığı, 8 dosya aynı anda.</dd>

    scale_a: "hücre rengi: süre", scale_b: "0.04 sn → 240 sn (log)",
    grid_aria: "Güncel test sonuçları, 16 çekirdek",
    notes_common: `<p>Hücre: <b>Z/X</b> ve programın ölçtüğü süre (okuma + arama + çıktı yazma + öz-kontrol).</p><p><b class="mk">[?]</b> süre sınırında ispatlanamadı: yazılan çözüm geçerli ama optimal olduğu bilinmiyor.</p><p><b class="mk">[—]</b> bu turda koşulmayan dosya.</p>`,
    notes_bench: `<p>Bu graflar bu çalışma için üretilen rastgele G(n, p) graflarıdır (<code>data/bench/</code>): dosya adı n ve kenar yüzdesini verir (ör. 14030 → n = 140, %30). Seyreklik arttıkça arama ağacı büyüyor; koşulmayanlar en seyrek graflar.</p>

    notes_meb: `<p>Bu graflar hocanın 2014 tarihli test graflarıdır (<code>data/MEBtest/</code>). Aynı adlı <code>data/bench/</code> graflarından farklıdırlar ve iç içedirler: her yoğunluk, bir altındakinin bütün kenarlarını içerir. 88 dosyanın hepsi koşuldu.</p>
      <p>10050'nin sonucu (Z = 91) dört bağımsız kesin çözücü ve sezgisel çözücüyle ayrıca doğrulandı. 74 dosya ispatlandı. En seyrek 14 dosya (%20'ler 12020'den, %30'lar 16030'dan itibaren) 300 sn sınırında ispatlanamadı; yazılan çözümler geçerli. Bu 14 dosyanın 8'inde sezgisel ILS aynı çözümü, 6'sında daha iyisini buldu (17020, 19030 ve 20020'de daha küçük Z; 16020, 18020 ve 18030'da aynı Z, daha küçük X). Bütün çıktılar <code>tools/verify.py</code> ile kontrol edildi.</p>`,

  en: {
    eyebrow: "Vertex integrity · exact solver",
    github: "Source on GitHub",
    h1: "ParçalaR search tree",
    credits: `<span>Posed by: <b>Murat Erşen Berberler</b></span><span>Solved by: <b>Can Atılgan</b>, <b>Claude Opus 5.5</b></span>`,
    lede: "How the exact cheapest way to break up a computer network is found and proven optimal: the problem, the skeleton of the algorithm, and a step-by-step serial and parallel search on the 7-computer example from the assignment.",
    p_h: "The problem",
    p1: "We wipe the disks of some computers in a network. Call the set of wiped computers <b>S</b>. <b>X = |S|</b> is the number of wiped computers and <b>Y</b> is the size of the largest connected part of what remains. The goal is to make <span class=\"formula\">Z = X + Y</span> as small as possible. Among solutions with the same Z, the one that wipes the fewest computers is chosen.",
    p2: "In the literature this is the <b>vertex integrity</b> of a graph. Barefoot, Entringer and Swart introduced it in 1987 precisely to measure how vulnerable a computer network is to attack <a class=\"cite\" href=\"#ref-1\">[1]</a>. It is <span class=\"tag-np\">NP-hard</span> on general graphs <a class=\"cite\" href=\"#ref-2\">[2]</a>: no exact method is known that is fast on every graph, so an exact answer needs a carefully pruned search.",
    p3: "The solver looks at the problem from the other side. Let <b>K</b> be the computers that survive. Then Z = n − (|K| − largest part), so making <span class=\"formula\">F = |K| − largest part</span> larger is the same as making Z smaller. The same reformulation appears in the literature <a class=\"cite\" href=\"#ref-3\">[3]</a> <a class=\"cite\" href=\"#ref-5\">[5]</a>. The search tries every structure that could increase F and stops once it has shown that none of them can do better. That is the proof of optimality.",
    refs: `<li id="ref-1"><span class="rt">Original definition</span>C. A. Barefoot, R. C. Entringer, H. C. Swart. <i>Vulnerability in graphs: a comparative survey.</i> J. Combin. Math. Combin. Comput. 1 (1987) 13–22. <span class="rn">The first paper to define integrity, as a measure of how vulnerable a computer network is.</span></li>
      <li id="ref-2"><span class="rt">NP-completeness</span>L. H. Clark, R. C. Entringer, M. R. Fellows. <i>Computational complexity of integrity.</i> J. Combin. Math. Combin. Comput. 2 (1987) 179–191. <span class="rn">Shows that deciding "is the integrity ≤ k?" is NP-complete, also on planar graphs.</span></li>
      <li id="ref-3"><span class="rt">Basic bounds</span>W. Goddard, H. C. Swart. <i>Integrity in graphs: bounds and basics.</i> J. Combin. Math. Combin. Comput. 7 (1990) 139–151. <span class="rn">Basic bounds and properties of integrity. [5] credits this work for the reformulation our solver also uses.</span></li>
      <li id="ref-4"><span class="rt">Parameterised complexity</span>P. G. Drange, M. S. Dregi, P. van 't Hof. <i>On the computational complexity of vertex integrity and component order connectivity.</i> Algorithmica (2016). <a href="https://arxiv.org/abs/1403.6331" target="_blank" rel="noopener">arXiv:1403.6331</a> <span class="rn">A fast exact algorithm when the answer p is small (O(p<sup>p+1</sup>·n)) and a kernel with p³ vertices.</span></li>
      <li id="ref-5"><span class="rt">Exact algorithm</span>S. Das, S. Das, S. S. Islam, R. M. Mitra, A. Mohapatra, A. Paul. <i>Solving vertex integrity faster than 2<sup>n</sup>.</i> arXiv (2026). <a href="https://arxiv.org/abs/2609.33779" target="_blank" rel="noopener">arXiv:2609.33779</a> <span class="rn">An O(1.9602<sup>n</sup>)-time exact algorithm and a 2<sup>o(n)</sup> lower bound under ETH. Theoretical, with no implementation or experiments. Uses the Z = n − max |U| reformulation.</span></li>
      <li id="ref-6"><span class="rt">Basis of the heuristic</span>D. V. Andrade, M. G. C. Resende, R. F. Werneck. <i>Fast local search for the maximum independent set problem.</i> Journal of Heuristics 18 (2012) 525–547. <span class="rn">ILS (iterated local search) for maximum independent set. The heuristic solver generalises it to the constraint "every part ≤ k".</span></li>`,
    refs_note: `The solver's reformulation is the same as in [3] and [5]. The search itself (building the largest part from its start vertex, pruning with the region P, repeating passes until nothing changes) does not directly match a method in these sources. We have not surveyed the literature systematically, so a similar method may exist that we have not seen.`,
    fig_aria: "The 7-computer example network from the assignment: wiping computer 7 splits it into {1,2,6} and {3,4,5}.",
    fig_cap: "The assignment's example (n = 7). Wiping 7 splits the network into {1, 2, 6} and {3, 4, 5}: X = 1, Y = 3, <b>Z = 4</b>. Nothing does better.",
    a_h: "The algorithm",
    code_aria: "High-level pseudocode",
    code: [
      `<span class="kw">ParcalaR</span>(G):`,
      `  I ← maximum independent set;  F ← |I| − 1`,
      `  (F, Y) ← improve by local search  <span class="cm">// skipped in the demo</span>`,
      `  <span class="kw">repeat</span>  <span class="cm">// one pass</span>`,
      `    changed ← no`,
      `    <span class="kw">for each</span> start vertex c = 1 … n:<span class="badge par">parallel call</span>`,
      `      <span class="kw">for each</span> connected C1 (smallest vertex c):`,
      `        P ← V ∖ N[C1]  <span class="cm">// region not touching C1</span>`,
      `        <span class="kw">if</span> |P| &lt; F: prune  <span class="cm">// branch cannot improve</span>`,
      `        R ← largest set in P with parts ≤ |C1|`,
      `        <span class="kw">if</span> (|R|, Y′) is better:`,
      `          (F, Y) ← (|R|, Y′); changed ← yes<span class="badge crit">critical section</span>`,
      `          rescan c with the new bound`,
      `  <span class="kw">until</span> changed = no  <span class="cm">// unchanged pass = proof</span>`,
      `  Z ← n − F;  X ← Z − Y`,
    ],
    gloss: `<li><b>F</b> survivors − largest part. As it grows, Z = n − F shrinks.</li>
      <li><b>Y</b> size of the largest part. When Z ties, the larger Y wins, so X = Z − Y is smaller.</li>
      <li><b>C1</b> the largest part of the surviving network.</li>
      <li><b>c</b> start vertex: the smallest-numbered vertex of C1. Each C1 is built exactly once, from its own start vertex.</li>
      <li><b>N[C1]</b> C1 and its neighbours. If C1 is to stay the largest part, these cannot be used.</li>
      <li><b>R</b> the other computers that can survive next to C1. <b>Y′</b>: the largest part not touching R.</li>
      <li><b>parallel call</b> start vertices are independent and are handed out to threads. <b>critical section</b> the shared best value is updated under a lock.</li>`,
    tabs_aria: "Search mode",
    tab_s: "Serial", tab_p: "Parallel",
    sub_s: n => `· ${n} steps`, sub_p: n => `· 3 threads · ${n} steps`,
    play: "Play", pause: "Pause", replay: "Play again", step: "Step ›", reset: "Restart", speed: "Speed", speed_aria: "Animation speed",
    counter: (i, n) => `step ${i} / ${n}`,
    c_pass: "pass", c_best: "shared best", c_done: "optimality proven",
    legend: `<span><i class="sw c1"></i>C1</span><span><i class="sw nb"></i>N[C1] ∖ C1: unusable</span><span><i class="sw reg"></i>region P</span><span><i class="sw r"></i>R</span><span><i class="sw s"></i>wiped</span>`,
    tree_h: "Search tree",
    tree_hint: `faded: not visited yet · <i class="sw box pr"></i> pruned · <i class="sw box ck"></i> R tried · <i class="sw box im"></i> improvement`,
    tree_aria: "Search tree: passes, start vertices and the connected sets that were tried",
    pass_label: p => `Pass ${p}`,
    wname: w => `Thread ${w}`, wsingle: "single thread", wshort: w => `T${w}`, copy: "copy ",
    g_aria: w => w ? `Network view for thread ${w}` : "Network view",
    intro: p => `Press <b>Play</b> or <b>Step</b> to begin. ${p.par ? "Parallel mode shows 3 threads (the tests used 16); each one grabs the next start vertex when it becomes free." : "In serial mode a single thread scans start vertices 1 to 7 in order."}`,
    start: p => `Start: maximum independent set I = ${fmt(p.I)}, α = ${p.I.length}. That gives F = ${p.F}, Y = ${p.Y}, so Z = ${p.Z}. The search will try to improve on it.`,
    pass: p => p.par ? `Pass ${p.pass} begins. Each thread takes its own copy of the shared (F, Y) = (${p.F}, ${p.Y}) and prunes with that copy for the whole pass.` : `Pass ${p.pass} begins: every start vertex will be scanned with (F, Y) = (${p.F}, ${p.Y}).`,
    anchor: p => `Start vertex c = ${p.c}: build the connected sets whose smallest vertex is ${p.c}, one by one.`,
    visit: p => `C1 = ${fmt(p.A)}${p.A.length === 1 ? " (the start vertex itself)" : ""}.`,
    region: p => `P = V ∖ N[C1] = ${fmt(p.P)}, |P| = ${p.P.length}. The neighbours of C1, ${fmt(p.nb)}, cannot be used.`,
    prune: p => `|P| = ${p.P} &lt; F = ${p.F}: pruned. Growing C1 only shrinks P, so no extension of this branch can improve.`,
    check: p => `Largest R in P with parts ≤ ${p.k}: R = ${fmt(p.R)}, |R| = ${p.f}, Y′ = ${p.y}. ${p.better ? `<b>Better than the current (${p.F}, ${p.Y})!</b>` : `Not better than (${p.F}, ${p.Y}).`}`,
    improve_s: p => `New best: (F, Y) = (${p.F}, ${p.Y}), so Z = ${p.Z}, X = ${p.X}.`,
    improve_p: p => `Found (F, Y) = (${p.F}, ${p.Y}) in its own copy. It checks the shared best inside the critical section: ${p.g ? "<b>shared best updated.</b>" : `shared best is already (${p.gF}, ${p.gY}), unchanged.`} The other threads do not see this during the current pass.`,
    restart: p => `Start vertex c = ${p.c} is rescanned with the new bound.`,

/* ---------------- tree layout ---------------- */
function layoutTree(steps) {
  const nodes = new Map(), kids = new Map(), roots = [], runs = {};
  for (const s of steps) for (const e of s) {
    if (e.t === "pass") { nodes.set(e.id, { id: e.id, pass: e.pass, root: true, label: "Geçiş " + e.pass }); kids.set(e.id, []); roots.push(e.id); }
    if (e.t === "visit") {
      let label = fmt(e.A).replace(/ /g, ""), run = 0;
      if (e.A.length === 1) { const key = e.parent + ":" + e.A[0]; run = runs[key] = (runs[key] || 0) + 1; if (run > 1) label += " ↻"; }
      nodes.set(e.id, { id: e.id, label, parent: e.parent, c: e.A[0], run });
      kids.set(e.id, []); kids.get(e.parent).push(e.id);
    }
  }
  for (const r of roots) kids.get(r).sort((a, b) => (nodes.get(a).c - nodes.get(b).c) || (nodes.get(a).run - nodes.get(b).run));
  const ROW = 27, COL = 98, PADX = 10, PADY = 18;
  let leaf = 0, maxX = 0;
  const place = (id, d) => {
    const n = nodes.get(id), ch = kids.get(id);
    n.w = Math.max(30, (n.root ? 8 : n.label.length) * 6.9 + 14);
    n.x = PADX + d * COL;
    if (!ch.length) { n.y = PADY + leaf * ROW; leaf++; }
    else { ch.forEach(c => place(c, d + 1)); n.y = (nodes.get(ch[0]).y + nodes.get(ch[ch.length - 1]).y) / 2; }
    maxX = Math.max(maxX, n.x + n.w);
  };
  roots.forEach((r, i) => { if (i) leaf += 0.8; place(r, 0); });
  return { nodes, kids, roots, width: maxX + PADX, height: PADY * 2 + (leaf - 1) * ROW };
}
function drawTree(svg, L) {
  svg.innerHTML = "";
  svg.setAttribute("width", L.width); svg.setAttribute("height", L.height);
  svg.setAttribute("viewBox", `0 0 ${L.width} ${L.height}`);
  const edgeG = el("g", {}, svg), nodeG = el("g", {}, svg);
  const R = { nodes: {}, edges: {}, rootText: {} };
  for (const n of L.nodes.values()) {
    if (n.parent != null) {
      const p = L.nodes.get(n.parent), x1 = p.x + p.w, x2 = n.x, mx = (x1 + x2) / 2;
      R.edges[n.id] = el("path", { class: "te", d: `M${x1},${p.y} C${mx},${p.y} ${mx},${n.y} ${x2},${n.y}` }, edgeG);
    }
    const g = el("g", { class: "tn ghost" + (n.root ? " root" : ""), transform: `translate(${n.x},${n.y})` }, nodeG);
    const inner = el("g", { class: "inner" }, g);
    el("rect", { x: 0, y: -10, width: n.w, height: 20, rx: n.root ? 4 : 10 }, inner);
    const tx = el("text", { x: n.w / 2, y: 0.5, "text-anchor": "middle" }, inner);
    tx.textContent = n.root ? t("pass_label")(n.pass) : n.label;
    if (n.root) R.rootText[n.id] = { el: tx, pass: n.pass };
    R.nodes[n.id] = g;
  }
  return R;
}

          st.done = true; st.F = e.F; st.Y = e.Y;
          for (let k = 0; k < workers; k++) { st.local[k].c = null; paintGraph(G[k], { S: e.S, c1: [1, 2, 6], r: [3, 4, 5] }); }
          row(0, "done", { Z: e.Z, X: e.X, S: e.S });
          break;
      }
    }
    render();
  }
  function stepOnce() {
    if (i >= total) { stop(); return false; }
    apply(steps[i]); i++;
    if (i >= total) stop();
    return true;
  }
  const interval = () => 2000 / parseFloat(speedIn.value);
  function tick() { if (stepOnce()) { timer = setTimeout(tick, interval()); playLabel(); } }
  function play() { if (i >= total) reset(); if (timer) return; tick(); }
  function stop() { if (timer) clearTimeout(timer); timer = null; playLabel(); }
  bPlay.addEventListener("click", () => timer ? stop() : play());
  bStep.addEventListener("click", () => { stop(); stepOnce(); });
  bReset.addEventListener("click", reset);
  i = 0; reset(); relabel();
  return { play, stop, refresh: render, relabel, total };
}

/* ---------------- static text + language ---------------- */
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(e => { e.innerHTML = t(e.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.i18nAria)));
  document.getElementById("code").innerHTML = t("code").map((c, k) => `<li data-line="${k + 1}"><span class="ln">${k + 1}</span><span>${c}</span><span class="dots"></span></li>`).join("");
  document.getElementById("lang-tr").setAttribute("aria-pressed", lang === "tr");
  document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en");
  document.title = lang === "tr" ? "ParçalaR Arama Ağacı" : "ParçalaR Search Tree";
  for (const m of ["light", "dark"]) {
    const b = document.getElementById("theme-" + m);
    b.textContent = t("th_" + m); b.setAttribute("aria-pressed", theme === m);
  }
}
applyStatic();

/* ---------------- tabs ---------------- */
const serialSteps = SIM.serial().map(e => [e]);
const parallelSteps = SIM.parallel(T);
const players = {
  seri: makePlayer(document.getElementById("panel-seri"), serialSteps, false),
  paralel: makePlayer(document.getElementById("panel-paralel"), parallelSteps, true),
};
function subs() {
  document.getElementById("sub-seri").textContent = t("sub_s")(players.seri.total);
  document.getElementById("sub-paralel").textContent = t("sub_p")(players.paralel.total);
}
subs();
let active = "seri";
function select(name, focus) {
  active = name;
  for (const k of ["seri", "paralel"]) {
    const on = k === name, tab = document.getElementById("tab-" + k);
    tab.setAttribute("aria-selected", on); tab.tabIndex = on ? 0 : -1;
    document.getElementById("panel-" + k).hidden = !on;
    if (!on) players[k].stop();
  }
  if (focus) document.getElementById("tab-" + name).focus();
  players[name].refresh();
  try { history.replaceState(null, "", "#" + name); } catch (e) {}
}
for (const k of ["seri", "paralel"]) {
  const tab = document.getElementById("tab-" + k);
  tab.addEventListener("click", () => select(k));
  tab.addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") { ev.preventDefault(); select(k === "seri" ? "paralel" : "seri", true); }
  });
}

/* ---------------- results grid ---------------- */
function renderGrid() {
  if (!ILS[dataset].length && method === "ils") method = "exact";
  if (!SEED[dataset].length && method === "seed") method = "exact";
  const ils = method === "ils", seed = method === "seed";
  const rows = ils ? ILS[dataset] : seed ? SEED[dataset] : DATA[dataset];
  const exact = {}; for (const r of DATA[dataset]) exact[r[0]] = r;
  const by = {}; for (const r of rows) by[r[0]] = r;
  const pcts = [20, 30, 40, 50, 60, 70, 80, 90];
  const lo = Math.log10(0.04), hi = Math.log10(240);
  let nProven = 0, nMatch = 0, nZonly = 0, worst = 0, nBetter = 0;
  let html = `<thead><tr><th scope="col">n</th>${pcts.map(p => `<th scope="col">%${p}</th>`).join("")}</tr></thead><tbody>`;
  for (let n = 100; n <= 200; n += 10) {
    html += `<tr><th scope="row">${n}</th>`;
    for (const p of pcts) {
      const k = `${n}${p}`, r = by[k];
      if (!r) { html += `<td class="na" title="${t("na")(k)}">—</td>`; continue; }
      const tm = r[5], q = Math.min(1, Math.max(0, (Math.log10(Math.max(tm, 0.01)) - lo) / (hi - lo)));
      const heat = Math.round(q * 72);
      let mark, title, miss = false;
      if (ils) {
        const e = exact[k];
        worst = Math.max(worst, tm);
        if (e && e[3] === "ispatli") { nProven++; if (e[1] === r[1] && e[2] === r[2]) { nMatch++; mark = " ✓"; } else { if (e[1] === r[1]) nZonly++; mark = " ≠"; miss = true; } }
        else mark = " ?";
        title = `${k}.txt · ${t("ils_title")}`;
      } else if (seed) {
        const e = exact[k];
        mark = r[3] === "ispatli" ? "" : " ?";
        if (e && (r[1] < e[1] || (r[1] === e[1] && r[2] < e[2]))) { mark += " +"; nBetter++; }
        title = `${k}.txt · ${t("seed_title")} · ${r[3] === "ispatli" ? t("proven") : t("unproven")}`;
      } else {
        mark = r[3] === "ispatli" ? "" : " ?";
        title = `${k}.txt · ${r[3] === "ispatli" ? t("proven") : t("unproven")}`;
      }
      html += `<td style="--heat:${heat}%" class="${heat > 40 ? "hot" : ""}${miss ? " miss" : ""}" title="${title}"><span class="zx">${r[1]}/${r[2]}${mark}</span><span class="t">${tm.toFixed(2)} ${t("sec")}</span></td>`;
    }
    html += `</tr>`;
  }
  document.getElementById("grid").innerHTML = html + "</tbody>";
  document.getElementById("sum-note").textContent = t("sum")(RESULTS.length, RESULTS_MEB.length);
  const nP = rows.filter(r => r[3] === "ispatli").length;
  document.getElementById("method-sum").innerHTML = ils ? t("ils_sum")(nMatch, nProven, worst, nZonly)
    : seed ? t("seed_sum")(rows.length, nP, rows.length - nP, nBetter)
    : t("exact_sum")(rows.length, nP);
  document.getElementById("notes").innerHTML = ils ? t("notes_ils") : seed ? t("notes_seed") : t("notes_common") + t("notes_" + dataset);
  for (const k of ["bench", "meb"]) {
    const b = document.getElementById("dtab-" + k), on = k === dataset;
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
  }
  const bi = document.getElementById("mt-ils");
  bi.disabled = !ILS[dataset].length;
  bi.title = bi.disabled ? t("mt_ils_na") : "";
  const bs = document.getElementById("mt-seed");
  bs.disabled = !SEED[dataset].length;
  bs.title = bs.disabled ? t("mt_ils_na") : "";
  document.getElementById("mt-exact").setAttribute("aria-pressed", !ils && !seed);
  bi.setAttribute("aria-pressed", ils);
  bs.setAttribute("aria-pressed", seed);
}
renderGrid();
document.getElementById("mt-exact").addEventListener("click", () => { method = "exact"; renderGrid(); });
document.getElementById("mt-ils").addEventListener("click", () => { method = "ils"; renderGrid(); });
document.getElementById("mt-seed").addEventListener("click", () => { method = "seed"; renderGrid(); });
for (const k of ["bench", "meb"]) {
  const b = document.getElementById("dtab-" + k);
  b.addEventListener("click", () => { dataset = k; renderGrid(); });
  b.addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") { ev.preventDefault(); dataset = k === "bench" ? "meb" : "bench"; renderGrid(); document.getElementById("dtab-" + dataset).focus(); }
  });
}

function setLang(l) {
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem("parcalar-lang", l); } catch (e) {}
  applyStatic(); subs(); renderGrid();
  players.seri.relabel(); players.paralel.relabel();
  players[active].refresh();
}
document.getElementById("lang-tr").addEventListener("click", () => setLang("tr"));
document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
for (const m of ["light", "dark"]) document.getElementById("theme-" + m).addEventListener("click", () => {
  theme = m; applyTheme();
  try { localStorage.setItem("parcalar-theme", m); } catch (e) {}
  for (const k of ["light", "dark"]) document.getElementById("theme-" + k).setAttribute("aria-pressed", theme === k);
});

const start = location.hash === "#paralel" ? "paralel" : "seri";
select(start);
if (location.hash === "#testler" || location.hash === "#tests") document.getElementById("tests").open = true;
if (!reduced) players[start].play();
</script>
