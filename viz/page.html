<style>
/* Layout: one reading column for the problem; a two-column workbench (pseudocode | animation) below; results tucked in a disclosure. */
:root {
  --bg: #fbf7ef;          /* ivory */
  --surface: #f4ebdc;
  --ghost: #ebdfcc;
  --line: #e0cfb6;
  --line-strong: #b9a184;
  --ink: #2a1e14;
  --muted: #7a6550;
  --accent: #d9631e;      /* orange */
  --on-accent: #fffaf2;
  --w0: #d9631e;          /* thread 1: orange */
  --w1: #b8861a;          /* thread 2: ochre */
  --w2: #9a3a1a;          /* thread 3: brick */
  --r-fill: #f3d9a4;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1510; --surface: #251c15; --ghost: #33281e; --line: #3d3026; --line-strong: #6e5a47;
    --ink: #f3e9da; --muted: #b39e86; --accent: #f08a3e; --on-accent: #1b1510;
    --w0: #f08a3e; --w1: #e0b04a; --w2: #e2714b; --r-fill: #5b4521;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1510; --surface: #251c15; --ghost: #33281e; --line: #3d3026; --line-strong: #6e5a47;
  --ink: #f3e9da; --muted: #b39e86; --accent: #f08a3e; --on-accent: #1b1510;
  --w0: #f08a3e; --w1: #e0b04a; --w2: #e2714b; --r-fill: #5b4521;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 48px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.12; }
h1 { font-size: clamp(2rem, 4.4vw, 3.1rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.55rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
.eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.lede { max-width: 64ch; color: var(--muted); font-size: 1.05rem; }
header { display: grid; gap: 14px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.toplinks { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.gh { display: inline-flex; align-items: center; gap: 7px; font: 600 0.85rem var(--body); color: var(--ink); text-decoration: none; border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 11px; }
.gh:hover { border-color: var(--accent); color: var(--accent); }
.gh svg { width: 16px; height: 16px; fill: currentColor; }
.lang { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.lang button { font: 600 0.8rem var(--mono); letter-spacing: 0.06em; color: var(--muted); background: transparent; border: 0; padding: 5px 11px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
code, .mono { font-family: var(--mono); font-size: 0.9em; }
.formula { font-family: var(--mono); background: var(--surface); padding: 2px 7px; border-radius: 4px; white-space: nowrap; }

/* problem */
.problem { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 32px; align-items: start; }
.problem .text { display: grid; gap: 14px; max-width: 66ch; min-width: 0; }
.problem figure { margin: 0; display: grid; gap: 8px; }
.problem figure svg { background: var(--surface); border-radius: 8px; }
.problem figcaption { font-size: 0.85rem; color: var(--muted); }
.tag-np { display: inline-block; font-family: var(--mono); font-size: 0.78rem; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 1px 9px; }

/* workbench */
.bench { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 28px; align-items: start; }
.bench > * { min-width: 0; }
.code-col { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 14px; }
.code { list-style: none; margin: 0; padding: 14px 0; background: var(--surface); border-radius: 8px; font-family: var(--mono); font-size: 0.75rem; line-height: 1.75; overflow-x: auto; }
.code li { display: grid; grid-template-columns: 2.6em max-content auto; align-items: center; padding-right: 14px; transition: background-color .2s; white-space: pre; }
.code .ln { color: var(--muted); text-align: right; padding-right: 1em; user-select: none; }
.code .cm { color: var(--muted); }
.code .kw { color: var(--accent); font-weight: 600; }
.code .badge { font-size: 0.68rem; letter-spacing: 0.04em; border-radius: 4px; padding: 1px 6px; margin-left: 8px; border: 1px solid currentColor; }
.code .badge.par { color: var(--w0); }
.code .badge.crit { color: var(--w2); }
.code li.hl { background: color-mix(in srgb, var(--hlc, var(--accent)) 20%, transparent); }
.code li .dots { display: inline-flex; gap: 4px; margin-left: 10px; }
.code li .dots i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.gloss { display: grid; gap: 4px; font-size: 0.84rem; color: var(--muted); margin: 0; padding: 0; list-style: none; }
.gloss b { color: var(--ink); font-family: var(--mono); font-weight: 600; font-size: 0.82rem; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab { font: 600 0.92rem var(--body); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 9px; cursor: pointer; margin-bottom: -1px; }
.tab .sub { font-weight: 400; font-size: 0.78rem; margin-left: 6px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible, button:focus-visible, summary:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stage { display: grid; gap: 14px; padding-top: 16px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.btn { font: 600 0.85rem var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); min-width: 104px; }
.btn:hover { filter: brightness(0.97); }
.speed { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
.speed input { width: 96px; accent-color: var(--accent); }
.counter { margin-left: auto; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.status { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 0.78rem; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
.chip b { color: var(--accent); font-weight: 600; }
.chip.ok { border-color: var(--accent); color: var(--accent); }
.caption { min-height: 4.8em; font-size: 0.92rem; display: grid; gap: 3px; align-content: start; }
.caption .ln-w { display: flex; gap: 8px; align-items: baseline; }
.caption .who { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
.graphs { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 12px; }
.gbox { display: grid; gap: 4px; min-width: 0; }
.gbox .ghead { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 0.74rem; color: var(--muted); flex-wrap: wrap; }
.gbox .ghead .wname { font-weight: 600; }
.gbox svg { width: 100%; height: auto; max-height: 190px; background: var(--surface); border-radius: 8px; border-top: 3px solid var(--wc, var(--accent)); }
.single .gbox svg { max-height: 230px; }
.g-edge { stroke: var(--line-strong); stroke-width: 1.6; transition: opacity .25s; }
.g-edge.off { opacity: .25; }
.g-node circle { fill: var(--bg); stroke: var(--line-strong); stroke-width: 1.6; transition: fill .25s, stroke .25s; }
.g-node text { font: 600 13px var(--mono); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
.g-node .x { stroke: var(--on-accent); stroke-width: 2.4; opacity: 0; }
.g-node.reg circle { stroke: var(--accent); stroke-width: 2.6; }
.g-node.nb circle { fill: var(--ghost); stroke-dasharray: 3 3; }
.g-node.nb text { fill: var(--muted); }
.g-node.r circle { fill: var(--r-fill); stroke: var(--w1); stroke-width: 2.6; }
.g-node.c1 circle { fill: var(--accent); stroke: var(--accent); }
.g-node.c1 text { fill: var(--on-accent); }
.g-node.s circle { fill: var(--w2); stroke: var(--w2); }
.g-node.s text { opacity: 0; }
.g-node.s .x { opacity: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 13px; height: 13px; border-radius: 50%; display: inline-block; border: 2px solid var(--line-strong); background: var(--bg); vertical-align: -2px; }
.sw.c1 { background: var(--accent); border-color: var(--accent); }
.sw.nb { background: var(--ghost); border-style: dashed; }
.sw.reg { border-color: var(--accent); }
.sw.r { background: var(--r-fill); border-color: var(--w1); }
.sw.s { background: var(--w2); border-color: var(--w2); }
.sw.box { border-radius: 4px; width: 18px; }
.sw.box.pr { border-style: dashed; background: transparent; }
.sw.box.ck { border-color: var(--accent); }
.sw.box.im { background: var(--accent); border-color: var(--accent); }
.tree-wrap { background: var(--surface); border-radius: 8px; overflow: auto; max-height: 440px; }
.tree-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.tree-head .hint { font-size: 0.78rem; color: var(--muted); }
svg.tree { display: block; }
.te { fill: none; stroke: var(--line); stroke-width: 1.3; transition: stroke .3s; }
.te.vis { stroke: var(--line-strong); }
.tn rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; transition: fill .25s, stroke .25s, stroke-width .2s; }
.tn text { font: 500 11px var(--mono); fill: var(--muted); dominant-baseline: central; transition: fill .25s; }
.tn .inner { transform-box: fill-box; transform-origin: center; }
.tn.ghost { opacity: .38; }
.tn.vis rect { stroke: var(--wc, var(--line-strong)); }
.tn.vis text { fill: var(--ink); }
.tn.vis .inner { animation: pop .32s ease-out; }
.tn.root rect { fill: var(--ink); stroke: var(--ink); }
.tn.root text { fill: var(--bg); font-weight: 600; }
.tn.root.ghost { opacity: .55; }
.tn.pruned rect { stroke-dasharray: 4 3; fill: transparent; }
.tn.pruned text { fill: var(--muted); text-decoration: line-through; }
.tn.checked rect { stroke-width: 2; }
.tn.improved rect { fill: var(--wc, var(--accent)); stroke: var(--wc, var(--accent)); }
.tn.improved text { fill: var(--on-accent); font-weight: 600; }
.tn.cur rect { stroke-width: 3; }
.tn.cur .inner { animation: pop .32s ease-out, pulse 1.1s ease-in-out infinite .32s; }
@keyframes pop { from { transform: scale(.55); opacity: .2; } to { transform: scale(1); opacity: 1; } }
@keyframes pulse { 50% { opacity: .55; } }

/* results */
details.tests { border-top: 1px solid var(--line); padding-top: 18px; }
details.tests > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
details.tests > summary::-webkit-details-marker { display: none; }
details.tests > summary h2::before { content: "▸"; display: inline-block; color: var(--accent); margin-right: 10px; transition: transform .2s; }
details.tests[open] > summary h2::before { transform: rotate(90deg); }
details.tests > summary .sum-note { color: var(--muted); font-size: 0.9rem; }
.tests-body { display: grid; gap: 22px; padding-top: 20px; }
.env { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 32px; }
.env dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 0.9rem; }
.env dt { color: var(--muted); }
.env dd { margin: 0; min-width: 0; }
.env .sub { color: var(--muted); }
.cmd { font-family: var(--mono); font-size: 0.8rem; background: var(--surface); border-radius: 6px; padding: 10px 12px; overflow-x: auto; white-space: pre; }
.flags { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 0.88rem; }
.flags code { color: var(--accent); font-weight: 600; }
.table-wrap { overflow-x: auto; }
table.grid { border-collapse: separate; border-spacing: 3px; font-variant-numeric: tabular-nums; min-width: 760px; width: 100%; }
table.grid th { font: 600 0.78rem var(--mono); color: var(--muted); padding: 4px 6px; text-align: center; }
table.grid th[scope="row"] { text-align: right; padding-right: 10px; }
table.grid td { text-align: center; padding: 6px 4px; border-radius: 5px; background: color-mix(in srgb, var(--accent) var(--heat, 0%), var(--surface)); }
table.grid td .zx { font-family: var(--mono); font-weight: 600; font-size: 0.86rem; display: block; }
table.grid td .t { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); display: block; }
table.grid td.hot .t { color: var(--ink); }
table.grid td.na { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-family: var(--mono); }
.notes { display: grid; gap: 6px; font-size: 0.86rem; color: var(--muted); max-width: 80ch; }
.scale { display: flex; align-items: center; gap: 8px; font-size: 0.76rem; color: var(--muted); font-family: var(--mono); flex-wrap: wrap; }
.scale .bar { width: 140px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, var(--surface), color-mix(in srgb, var(--accent) 75%, var(--surface))); }

@media (max-width: 1000px) {
  .bench { grid-template-columns: minmax(0, 1fr); }
  .code-col { position: static; }
  .problem { grid-template-columns: minmax(0, 1fr); }
  .env { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .graphs { grid-template-columns: minmax(0, 1fr); }
  .counter { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { transition: none !important; animation: none !important; }
}
</style>

      let label = fmt(e.A).replace(/ /g, ""), run = 0;
      if (e.A.length === 1) { const key = e.parent + ":" + e.A[0]; run = runs[key] = (runs[key] || 0) + 1; if (run > 1) label += " ↻"; }
      nodes.set(e.id, { id: e.id, label, parent: e.parent, c: e.A[0], run });
      kids.set(e.id, []); kids.get(e.parent).push(e.id);
    }
  }
  for (const r of roots) kids.get(r).sort((a, b) => (nodes.get(a).c - nodes.get(b).c) || (nodes.get(a).run - nodes.get(b).run));
  const ROW = 27, COL = 98, PADX = 10, PADY = 18;
  let leaf = 0, maxX = 0;
  const place = (id, d) => {
    const n = nodes.get(id), ch = kids.get(id);
    n.w = Math.max(30, (n.root ? 8 : n.label.length) * 6.9 + 14);
    n.x = PADX + d * COL;
    if (!ch.length) { n.y = PADY + leaf * ROW; leaf++; }
    else { ch.forEach(c => place(c, d + 1)); n.y = (nodes.get(ch[0]).y + nodes.get(ch[ch.length - 1]).y) / 2; }
    maxX = Math.max(maxX, n.x + n.w);
  };
  roots.forEach((r, i) => { if (i) leaf += 0.8; place(r, 0); });
  return { nodes, kids, roots, width: maxX + PADX, height: PADY * 2 + (leaf - 1) * ROW };
}
function drawTree(svg, L) {
  svg.innerHTML = "";
  svg.setAttribute("width", L.width); svg.setAttribute("height", L.height);
  svg.setAttribute("viewBox", `0 0 ${L.width} ${L.height}`);
  const edgeG = el("g", {}, svg), nodeG = el("g", {}, svg);
  const R = { nodes: {}, edges: {}, rootText: {} };
  for (const n of L.nodes.values()) {
    if (n.parent != null) {
      const p = L.nodes.get(n.parent), x1 = p.x + p.w, x2 = n.x, mx = (x1 + x2) / 2;
      R.edges[n.id] = el("path", { class: "te", d: `M${x1},${p.y} C${mx},${p.y} ${mx},${n.y} ${x2},${n.y}` }, edgeG);
    }
    const g = el("g", { class: "tn ghost" + (n.root ? " root" : ""), transform: `translate(${n.x},${n.y})` }, nodeG);
    const inner = el("g", { class: "inner" }, g);
    el("rect", { x: 0, y: -10, width: n.w, height: 20, rx: n.root ? 4 : 10 }, inner);
    const tx = el("text", { x: n.w / 2, y: 0.5, "text-anchor": "middle" }, inner);
    tx.textContent = n.root ? t("pass_label")(n.pass) : n.label;
    if (n.root) R.rootText[n.id] = { el: tx, pass: n.pass };
    R.nodes[n.id] = g;
  }
  return R;
}

/* ---------------- player ---------------- */
function makePlayer(panel, steps, parallelMode) {
  const workers = parallelMode ? T : 1;
  const stage = h("div", "stage" + (parallelMode ? "" : " single"));
  const controls = h("div", "controls");
  const bPlay = h("button", "btn primary"); bPlay.type = "button";
  const bStep = h("button", "btn"); bStep.type = "button";
  const bReset = h("button", "btn"); bReset.type = "button";
  const speed = h("label", "speed");
  const sid = "speed-" + (parallelMode ? "p" : "s");
  const speedTxt = h("span");
  const speedIn = h("input"); speedIn.type = "range"; speedIn.id = sid; speedIn.min = "0.5"; speedIn.max = "4"; speedIn.step = "0.5"; speedIn.value = "1.5";
  speed.append(speedTxt, speedIn);
  const counter = h("span", "counter");
  controls.append(bPlay, bStep, bReset, speed, counter);
  const status = h("div", "status");
  const caption = h("div", "caption"); caption.setAttribute("aria-live", "polite");
  const graphs = h("div", "graphs"); graphs.style.setProperty("--cols", workers);
  const G = [], heads = [], gsvgs = [];
  for (let w = 0; w < workers; w++) {
    const box = h("div", "gbox"); box.style.setProperty("--wc", WCOL[w]);
    const head = h("div", "ghead");
    const svg = document.createElementNS(NS, "svg"); svg.setAttribute("role", "img");
    box.append(head, svg); graphs.append(box);
    G.push(drawGraph(svg)); heads.push(head); gsvgs.push(svg);
  }
  const legend = h("div", "legend");
  const treeHead = h("div", "tree-head");
  const treeTitle = h("h3"), treeHint = h("span", "hint");
  treeHead.append(treeTitle, treeHint);
  const treeWrap = h("div", "tree-wrap");
  const svgTree = document.createElementNS(NS, "svg"); svgTree.setAttribute("class", "tree"); svgTree.setAttribute("role", "img");
  treeWrap.append(svgTree);
  stage.append(controls, status, caption, graphs, legend, treeHead, treeWrap);
  panel.append(stage);

  const L = layoutTree(steps);
  const total = steps.length;
  let TR, st, i, timer = null, rows = [], lines = [];

  function relabel() {
    bStep.textContent = t("step"); bReset.textContent = t("reset");
    speedTxt.textContent = t("speed"); speedIn.setAttribute("aria-label", t("speed_aria"));
    legend.innerHTML = t("legend"); treeTitle.textContent = t("tree_h"); treeHint.innerHTML = t("tree_hint");
    svgTree.setAttribute("aria-label", t("tree_aria"));
    gsvgs.forEach((s, w) => s.setAttribute("aria-label", t("g_aria")(parallelMode ? w + 1 : 0)));
    if (TR) for (const id in TR.rootText) TR.rootText[id].el.textContent = t("pass_label")(TR.rootText[id].pass);
    playLabel(); render();
  }
  function playLabel() { bPlay.textContent = timer ? t("pause") : (i >= total ? t("replay") : t("play")); }
  function reset() {
    stop();
    TR = drawTree(svgTree, L);
    st = { pass: 0, F: null, Y: null, local: Array.from({ length: workers }, () => ({ F: null, Y: null, c: null, view: {} })), cur: Array(workers).fill(null), done: false };
    i = 0; rows = [{ w: 0, k: "intro", p: { par: parallelMode } }]; lines = [];
    for (let w = 0; w < workers; w++) paintGraph(G[w], {});
    treeWrap.scrollTop = 0; treeWrap.scrollLeft = 0;
    playLabel(); render();
  }
  const Zof = F => SIM.N - F;
  function render() {
    counter.textContent = t("counter")(i, total);
    const chips = [];
    if (parallelMode && st.F != null) chips.push(`<span class="chip">${t("c_best")}</span>`);
    chips.push(`<span class="chip">${t("c_pass")} <b>${st.pass || "–"}</b></span>`);
    if (st.F != null) chips.push(`<span class="chip">F <b>${st.F}</b></span>`, `<span class="chip">Y <b>${st.Y}</b></span>`,
      `<span class="chip">Z = n − F = <b>${Zof(st.F)}</b></span>`, `<span class="chip">X = Z − Y = <b>${Zof(st.F) - st.Y}</b></span>`);
    if (st.done) chips.push(`<span class="chip ok">${t("c_done")}</span>`);
    status.innerHTML = chips.join("");
    for (let w = 0; w < workers; w++) {
      const lc = st.local[w];
      const name = `<span class="wname" style="color:${WCOL[w]}">${parallelMode ? t("wname")(w + 1) : t("wsingle")}</span>`;
      const info = lc.F != null ? `${lc.c ? "c=" + lc.c + " · " : ""}${parallelMode ? t("copy") : ""}F=${lc.F} Y=${lc.Y}` : "";
      heads[w].innerHTML = `${name}<span>${info}</span>`;
    }
    caption.innerHTML = rows.map(r => `<div class="ln-w">${parallelMode && r.k !== "intro" ? `<span class="who" style="color:${WCOL[r.w]}">${t("wshort")(r.w + 1)}</span>` : ""}<span>${t(r.k)(r.p)}</span></div>`).join("");
    if (panel.hidden) return;
    const code = document.getElementById("code");
    code.querySelectorAll("li").forEach(li => { li.classList.remove("hl"); li.style.removeProperty("--hlc"); li.querySelector(".dots").innerHTML = ""; });
    for (const { line, w } of lines) {
      const li = code.querySelector(`li[data-line="${line}"]`);
      if (!li) continue;
      if (!li.classList.contains("hl")) { li.classList.add("hl"); li.style.setProperty("--hlc", WCOL[w || 0]); }
      li.querySelector(".dots").insertAdjacentHTML("beforeend", `<i style="background:${WCOL[w || 0]}"></i>`);
    }
  }
  function setCur(w, id) {
    if (st.cur[w] != null && TR.nodes[st.cur[w]]) TR.nodes[st.cur[w]].classList.remove("cur");
    st.cur[w] = id;
    if (id != null && TR.nodes[id]) TR.nodes[id].classList.add("cur");
  }
  function visitNode(id, w) {
    const n = TR.nodes[id]; if (!n) return;
    n.classList.remove("ghost"); n.classList.add("vis");
    n.style.setProperty("--wc", parallelMode ? WCOL[w] : "var(--line-strong)");
    if (TR.edges[id]) TR.edges[id].classList.add("vis");
  }
  function scrollTo(id) {
    const node = L.nodes.get(id); if (!node) return;
    const top = Math.max(0, node.y - treeWrap.clientHeight / 2);
    const left = node.x + node.w > treeWrap.clientWidth + treeWrap.scrollLeft || node.x < treeWrap.scrollLeft ? Math.max(0, node.x - 40) : treeWrap.scrollLeft;
    treeWrap.scrollTo({ top, left, behavior: reduced ? "auto" : "smooth" });
  }
  function apply(step) {
    rows = []; lines = [];
    const row = (w, k, p) => rows.push({ w, k, p });
    for (const e of step) {
      const w = e.w || 0, lc = st.local[w];
      lines.push({ line: e.line, w });
      switch (e.t) {
        case "start":
          st.F = e.F; st.Y = e.Y; st.local.forEach(l => { l.F = e.F; l.Y = e.Y; });
          for (let k = 0; k < workers; k++) paintGraph(G[k], { r: e.I });
          row(0, "start", { I: e.I, F: e.F, Y: e.Y, Z: Zof(e.F) });
          break;
        case "pass":
          st.pass = e.pass; visitNode(e.id, 0); scrollTo(e.id);
          st.local.forEach(l => { l.F = st.F; l.Y = st.Y; l.c = null; });
          row(0, "pass", { par: parallelMode, pass: e.pass, F: st.F, Y: st.Y });
          lines.push({ line: 5, w: 0 });
          break;
        case "anchor":
          lc.c = e.c; row(w, "anchor", { c: e.c });
          break;
        case "visit":
          visitNode(e.id, w); setCur(w, e.id); scrollTo(e.id);
          lc.view = { c1: e.A }; paintGraph(G[w], lc.view);
          row(w, "visit", { A: e.A });
          break;
        case "region": {
          const nb = closedN(e.A).filter(v => !e.A.includes(v));
          lc.view = { c1: e.A, nb, reg: e.P }; paintGraph(G[w], lc.view);
          row(w, "region", { P: e.P, nb });
          break;
        }
        case "prune":
          TR.nodes[e.id].classList.add("pruned");
          row(w, "prune", { P: e.P.length, F: e.F });
          break;
        case "check": {
          TR.nodes[e.id].classList.add("checked");
          lc.view = Object.assign({}, lc.view, { r: e.R }); paintGraph(G[w], lc.view);
          const better = e.f > lc.F || (e.f === lc.F && e.y > lc.Y);
          row(w, "check", { k: e.A.length, R: e.R, f: e.f, y: e.y, F: lc.F, Y: lc.Y, better });
          lines.push({ line: 11, w });
          break;
        }
        case "improve": {
          TR.nodes[e.id].classList.add("improved");
          lc.F = e.F; lc.Y = e.Y;
          const g = e.F > st.F || (e.F === st.F && e.Y > st.Y);
          if (g) { st.F = e.F; st.Y = e.Y; }
          if (parallelMode) row(w, "improve_p", { F: e.F, Y: e.Y, g, gF: st.F, gY: st.Y });
          else row(w, "improve_s", { F: e.F, Y: e.Y, Z: Zof(e.F), X: Zof(e.F) - e.Y });
          break;
        }
        case "restart":
          row(w, "restart", { c: lc.c });
          break;
        case "barrier":
          for (let k = 0; k < workers; k++) setCur(k, null);
          row(0, "barrier", {});
          break;
        case "passend":
          for (let k = 0; k < workers; k++) setCur(k, null);
          row(0, "passend", { changed: e.changed, pass: e.pass, F: st.F, Y: st.Y });
          break;
        case "done":
          st.done = true; st.F = e.F; st.Y = e.Y;
          for (let k = 0; k < workers; k++) { st.local[k].c = null; paintGraph(G[k], { S: e.S, c1: [1, 2, 6], r: [3, 4, 5] }); }
          row(0, "done", { Z: e.Z, X: e.X, S: e.S });
          break;
      }
    }
    render();
  }
  function stepOnce() {
    if (i >= total) { stop(); return false; }
    apply(steps[i]); i++;
    if (i >= total) stop();
    return true;
  }
  const interval = () => 1100 / parseFloat(speedIn.value);
  function tick() { if (stepOnce()) { timer = setTimeout(tick, interval()); playLabel(); } }
  function play() { if (i >= total) reset(); if (timer) return; tick(); }
  function stop() { if (timer) clearTimeout(timer); timer = null; playLabel(); }
  bPlay.addEventListener("click", () => timer ? stop() : play());
  bStep.addEventListener("click", () => { stop(); stepOnce(); });
  bReset.addEventListener("click", reset);
  i = 0; reset(); relabel();
  return { play, stop, refresh: render, relabel, total };
}

/* ---------------- static text + language ---------------- */
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(e => { e.innerHTML = t(e.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.i18nAria)));
  document.getElementById("code").innerHTML = t("code").map((c, k) => `<li data-line="${k + 1}"><span class="ln">${k + 1}</span><span>${c}</span><span class="dots"></span></li>`).join("");
  document.getElementById("lang-tr").setAttribute("aria-pressed", lang === "tr");
  document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en");
  document.title = lang === "tr" ? "ParçalaR Arama Ağacı" : "ParçalaR Search Tree";
}
applyStatic();

/* ---------------- tabs ---------------- */
const serialSteps = SIM.serial().map(e => [e]);
const parallelSteps = SIM.parallel(T);
const players = {
  seri: makePlayer(document.getElementById("panel-seri"), serialSteps, false),
  paralel: makePlayer(document.getElementById("panel-paralel"), parallelSteps, true),
};
function subs() {
  document.getElementById("sub-seri").textContent = t("sub_s")(players.seri.total);
  document.getElementById("sub-paralel").textContent = t("sub_p")(players.paralel.total);
}
subs();
let active = "seri";
function select(name, focus) {
  active = name;
  for (const k of ["seri", "paralel"]) {
    const on = k === name, tab = document.getElementById("tab-" + k);
    tab.setAttribute("aria-selected", on); tab.tabIndex = on ? 0 : -1;
    document.getElementById("panel-" + k).hidden = !on;
    if (!on) players[k].stop();
  }
  if (focus) document.getElementById("tab-" + name).focus();
  players[name].refresh();
  try { history.replaceState(null, "", "#" + name); } catch (e) {}
}
for (const k of ["seri", "paralel"]) {
  const tab = document.getElementById("tab-" + k);
  tab.addEventListener("click", () => select(k));
  tab.addEventListener("keydown", ev => {
    if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") { ev.preventDefault(); select(k === "seri" ? "paralel" : "seri", true); }
  });
}

/* ---------------- results grid ---------------- */
function renderGrid() {
  const by = {}; for (const r of RESULTS) by[r[0]] = r;
  const pcts = [20, 30, 40, 50, 60, 70, 80, 90];
  const lo = Math.log10(0.04), hi = Math.log10(240);
  let html = `<thead><tr><th scope="col">n</th>${pcts.map(p => `<th scope="col">%${p}</th>`).join("")}</tr></thead><tbody>`;
  for (let n = 100; n <= 200; n += 10) {
    html += `<tr><th scope="row">${n}</th>`;
    for (const p of pcts) {
      const r = by[`${n}${p}`];
      if (!r) { html += `<td class="na" title="${t("na")(`${n}${p}`)}">—</td>`; continue; }
      const tm = r[5], k = Math.min(1, Math.max(0, (Math.log10(tm) - lo) / (hi - lo)));
      const heat = Math.round(k * 72);
      html += `<td style="--heat:${heat}%" class="${heat > 40 ? "hot" : ""}" title="${r[0]}.txt · ${r[3] === "ispatli" ? t("proven") : t("unproven")}"><span class="zx">${r[1]}/${r[2]}</span><span class="t">${tm.toFixed(2)} ${t("sec")}</span></td>`;
    }
    html += `</tr>`;
  }
  document.getElementById("grid").innerHTML = html + "</tbody>";
  document.getElementById("sum-note").textContent = t("sum")(RESULTS.length, RESULTS.filter(r => r[3] === "ispatli").length);
}
renderGrid();

function setLang(l) {
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem("parcalar-lang", l); } catch (e) {}
  applyStatic(); subs(); renderGrid();
  players.seri.relabel(); players.paralel.relabel();
  players[active].refresh();
}
document.getElementById("lang-tr").addEventListener("click", () => setLang("tr"));
document.getElementById("lang-en").addEventListener("click", () => setLang("en"));

const start = location.hash === "#paralel" ? "paralel" : "seri";
select(start);
if (location.hash === "#testler" || location.hash === "#tests") document.getElementById("tests").open = true;
if (!reduced) players[start].play();
</script>
